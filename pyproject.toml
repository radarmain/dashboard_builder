[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cdk.out", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"backend/app/chat_*.py" = ["E501"]  # long prompt/tool-description strings

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
